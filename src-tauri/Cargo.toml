[package]
name = "singulo"
version = "0.1.1"
description = "A local, copy-safe family photo archive"
authors = ["Singulo contributors"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "singulo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.38", features = ["bundled", "backup", "functions"] }
chrono = { version = "0.4", features = ["serde"] }
blake3 = "1"
uuid = { version = "1", features = ["v4"] }
walkdir = "2"
fs2 = "0.4"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "tiff", "bmp", "gif"] }
jpeg-decoder = { version = "0.3", default-features = false }
tempfile = "3"
wait-timeout = "0.2"
roxmltree = "0.21"

[target.'cfg(not(windows))'.dependencies]
trash = "5"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_System_Com", "Win32_System_IO", "Win32_System_Threading", "Win32_UI_Shell"] }

[profile.dev.package.image]
opt-level = 3

[profile.dev.package.zune-jpeg]
opt-level = 3

[profile.dev.package.jpeg-decoder]
opt-level = 3

# Generic decoder/resize code is instantiated in this crate, so optimise it in dev too.
[profile.dev.package.singulo]
opt-level = 3

[profile.dev.package.blake3]
opt-level = 3


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
